name: Model trial

# Compares writer models on the fixture payload (tests/fixtures/payload/
# from_fixtures.json) and names the cheapest one that passes the gate on every
# run. Manual only. Spends a few US cents of API credit; publishes nothing.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Briefs to write per model"
        type: choice
        default: "3"
        options: ["1", "3", "5"]

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-brief.txt
      - run: pip install -r requirements-brief.txt
      - name: Run the trial
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ inputs.runs }}
        run: |
          python -m modules.morning_brief.model_trial --models claude-haiku-5-5 claude-sonnet-5-5 --runs "$RUNS" \
            | tee trial.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-trial
          path: trial.json
          if-no-files-found: ignore
