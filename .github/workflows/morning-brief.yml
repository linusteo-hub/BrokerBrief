name: Morning brief

# Fetches, checks, writes, archives and publishes the BrokerBrief Morning
# Brief, then opens, updates or closes the `brief-alert` issue.
# What runs when, how to tell it is healthy and what each alert means:
# docs/operations.md.
#
# SCHEDULE: not enabled yet. Decision Batch 3 adds, under `on:`:
#   schedule:
#     - cron: "15 6 * * *"            # 06:15 Singapore time, primary
#       timezone: "Asia/Singapore"
#     - cron: "50 6 * * *"            # 06:50 Singapore time, fallback; skips if today's brief exists
#       timezone: "Asia/Singapore"
# Both are off the hour, which GitHub names as its busiest time for delays.

on:
  workflow_dispatch:
    inputs:
      break_feed:
        description: "Failure test: make one source fail on purpose"
        type: choice
        default: none
        options: [none, eia_spot, mpa_bunker_sales, imf_portwatch, gcaptain, splash247, maritime_executive]
      no_model:
        description: "Publish news as headline and link only (no model call)"
        type: boolean
        default: false
      archive:
        description: "Commit the result to the briefs branch (public)"
        type: boolean
        default: false
      publish:
        description: "Deploy the site to GitHub Pages (public)"
        type: boolean
        default: false
      force:
        description: "Run even if today's brief already exists"
        type: boolean
        default: false

concurrency:
  group: morning-brief
  cancel-in-progress: false

env:
  # Scheduled runs always archive and publish; manual runs only when asked.
  DO_ARCHIVE: ${{ github.event_name == 'schedule' || inputs.archive }}
  DO_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write      # push to the briefs branch
      issues: write        # the brief-alert issue
      actions: write       # re-enable this workflow (keep-alive)
    outputs:
      archived: ${{ steps.archive.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-brief.txt

      - name: Install
        run: pip install -r requirements-brief.txt

      - name: Keep the schedule alive
        # Scheduled workflows in a public repository are disabled after 60 days
        # without repository activity. This call is cheap and harmless; whether
        # it resets the 60-day clock is not documented, so it is a belt, not the
        # only braces (see docs/operations.md, "The 60-day rule").
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/morning-brief.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/tests.yml/enable"

      - name: Check out the archive
        id: checkout_archive
        run: |
          if git ls-remote --exit-code --heads origin briefs >/dev/null; then
            git fetch --depth 50 origin briefs
            git worktree add archive origin/briefs
            git -C archive switch -c briefs-work
          else
            git worktree add --detach archive
            git -C archive switch --orphan briefs-work
          fi
          echo "date=$(TZ=Asia/Singapore date +%F)" >> "$GITHUB_OUTPUT"

      - name: Skip if today's brief already exists
        id: skip
        run: |
          d="${{ steps.checkout_archive.outputs.date }}"
          if [ "${{ inputs.force }}" != "true" ] && [ -f "archive/briefs/${d:0:4}/${d:5:2}/${d:8:2}/brief.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Brief for $d already exists."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the payload
        id: payload
        if: steps.skip.outputs.skip != 'true'
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          BROKERBRIEF_BREAK_FEED: ${{ inputs.break_feed }}
        run: |
          mkdir -p work
          python -m modules.morning_brief --out work/payload.json

      - name: Write and check the brief
        id: write
        if: steps.skip.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ inputs.no_model != true && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          prev=$(python -c "from modules.morning_brief.archive import latest_payload; import json; d=json.load(open('work/payload.json'))['brief_date']; p=latest_payload('archive', d); print(p or '')")
          set +e
          python -m modules.morning_brief.write --payload work/payload.json --out-dir work/out ${prev:+--previous "$prev"}
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          # 3 = refused by the gate: not a crash. The alert step reports it.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      - name: Archive
        id: archive
        if: steps.skip.outputs.skip != 'true' && env.DO_ARCHIVE == 'true' && steps.write.outcome == 'success'
        run: |
          python -c "from modules.morning_brief.archive import store; store('archive', 'work/out', {'run_url': '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'})"
          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs
          git commit -m "Morning brief for ${{ steps.checkout_archive.outputs.date }}" || echo "nothing to commit"
          for i in 1 2 3 4; do git push origin HEAD:briefs && break; sleep $((i * 5)); git pull --rebase origin briefs || true; done

      - name: Keep the run's output
        if: always() && steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: brief-output
          path: work/out/          # the excerpt-free payload, the brief and the report
          retention-days: 14
          if-no-files-found: ignore

      - name: Decide on the alert
        id: decide
        if: always() && steps.skip.outputs.skip != 'true'
        env:
          FAILED_STEP: >-
            ${{ steps.payload.outcome == 'failure' && 'Build the payload' ||
                steps.write.outcome == 'failure' && 'Write and check the brief' ||
                steps.archive.outcome == 'failure' && 'Archive' ||
                steps.checkout_archive.outcome == 'failure' && 'Check out the archive' || '' }}
        run: |
          outcome=success; [ -n "$FAILED_STEP" ] && outcome=failure
          expect=""; [ -n "${{ secrets.ANTHROPIC_API_KEY != '' && 'yes' || '' }}" ] && [ "${{ inputs.no_model }}" != "true" ] && expect="--expect-model"
          python -m modules.morning_brief.alerts --archive archive --outcome "$outcome" --failed-step "$FAILED_STEP" \
            --report work/out/validation.json $expect \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > work/decision.json
          cat work/decision.json

      - name: Open, update or close the alert issue
        if: always() && steps.decide.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RUN: ${{ github.event_name != 'schedule' }}
        run: |
          action=$(jq -r .action work/decision.json)
          label=$(jq -r .label work/decision.json)
          title=$(jq -r .title work/decision.json)
          [ "$TEST_RUN" = "true" ] && title="$title (manual run)"
          jq -r .body work/decision.json > work/body.md
          gh label create "$label" --color B60205 --description "Raised by the morning-brief workflow" --force >/dev/null
          open=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          if [ "$action" = "alert" ]; then
            if [ -n "$open" ]; then gh issue comment "$open" --body-file work/body.md
            else gh issue create --title "$title" --label "$label" --body-file work/body.md; fi
          elif [ -n "$open" ]; then
            gh issue comment "$open" --body "Resolved: the run of ${{ steps.checkout_archive.outputs.date }} was clean. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue close "$open" --reason completed
          fi

  site:
    needs: brief
    if: always() && needs.brief.result != 'cancelled' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write        # alert if publishing fails
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}brief/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-brief.txt
      - run: pip install -r requirements-brief.txt
      - name: Build the site from the archive
        run: |
          git fetch --depth 1 origin briefs && git worktree add archive origin/briefs || mkdir -p archive
          python -m modules.morning_brief.site --archive archive --readme README.md --out _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Alert if publishing failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="Publishing the site to GitHub Pages failed, so the brief page was not updated. The brief itself may have been archived. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh label create brief-alert --color B60205 --description "Raised by the morning-brief workflow" --force >/dev/null
          open=$(gh issue list --label brief-alert --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
          else gh issue create --title "Morning brief needs attention" --label brief-alert --body "$body"; fi
